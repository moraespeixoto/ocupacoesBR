# Reconstroi e publica o site do pacote a cada push em main.
#
# Desde 09/09/2026 ele E quem publica: o repositorio foi aberto, o GitHub Pages
# aponta para gh-pages, e o docs/ deixou de ser versionado em main. O build
# local (Rscript data-raw/constroi_site.R) serve para conferir o site antes de
# empurrar, nao para publica-lo.
#
# Note que o passo abaixo reconstroi o site do zero com o mesmo script -- ele
# nao copia um docs/ commitado, que nao existe mais.
on:
  push:
    branches: [main]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Constroi o site
        run: Rscript data-raw/constroi_site.R

      - name: Publica em gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
